<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SMS healthcare booking architecture</title>
  <desc>A patient phone exchanges texts with an SMS gateway, which calls a backend webhook. The webhook hands messages to an agent loop that reads and writes a session store and calls four tools: clinic finder, cost estimator, booking and reminders. Three tools reach external sources: a clinic directory, price data and the clinics themselves.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { text-anchor: middle; dominant-baseline: central; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; }
      .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
      .ext rect { fill: #F1EFE8; stroke: #888780; }
      .ext .th { fill: #2C2C2A; }
      .ext .ts { fill: #5F5E5A; }
      .core rect { fill: #EEEDFE; stroke: #534AB7; }
      .core .th { fill: #3C3489; }
      .core .ts { fill: #534AB7; }
      .tool rect { fill: #E1F5EE; stroke: #0F6E56; }
      .tool .th { fill: #085041; }
      .tool .ts { fill: #0F6E56; }
      .label { fill: #5F5E5A; text-anchor: start; }
    </style>
  </defs>

  <rect width="680" height="540" fill="#FFFFFF"/>

  <!-- Outside the backend -->
  <g class="ext">
    <rect x="60" y="40" width="160" height="56" rx="8"/>
    <text class="th" x="140" y="58">SMS gateway</text>
    <text class="ts" x="140" y="76">One public number</text>
  </g>
  <g class="ext">
    <rect x="260" y="40" width="160" height="56" rx="8"/>
    <text class="th" x="340" y="58">Patient phone</text>
    <text class="ts" x="340" y="76">Any phone, text only</text>
  </g>
  <line class="arr" x1="258" y1="68" x2="222" y2="68" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="arr" x1="140" y1="98" x2="140" y2="178" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Backend service -->
  <rect x="40" y="140" width="600" height="240" rx="12" fill="none" stroke="#888780" stroke-dasharray="4 4"/>
  <text class="ts label" x="60" y="160">Backend service</text>

  <g class="core">
    <rect x="60" y="180" width="160" height="56" rx="8"/>
    <text class="th" x="140" y="198">Webhook handler</text>
    <text class="ts" x="140" y="216">Receives, replies</text>
  </g>
  <g class="core">
    <rect x="260" y="180" width="160" height="56" rx="8"/>
    <text class="th" x="340" y="198">Agent loop</text>
    <text class="ts" x="340" y="216">Claude with tool use</text>
  </g>
  <g class="core">
    <rect x="460" y="180" width="160" height="56" rx="8"/>
    <text class="th" x="540" y="198">Session store</text>
    <text class="ts" x="540" y="216">State and bookings</text>
  </g>
  <line class="arr" x1="222" y1="208" x2="258" y2="208" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="arr" x1="422" y1="208" x2="458" y2="208" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Agent to tools -->
  <path class="arr" d="M340 236 L340 268 M122 268 L558 268"/>
  <line class="arr" x1="122" y1="268" x2="122" y2="298" marker-end="url(#arrow)"/>
  <line class="arr" x1="267" y1="268" x2="267" y2="298" marker-end="url(#arrow)"/>
  <line class="arr" x1="412" y1="268" x2="412" y2="298" marker-end="url(#arrow)"/>
  <line class="arr" x1="558" y1="268" x2="558" y2="298" marker-end="url(#arrow)"/>

  <g class="tool">
    <rect x="60" y="300" width="125" height="56" rx="8"/>
    <text class="th" x="122" y="318">Clinic finder</text>
    <text class="ts" x="122" y="336">Nearest by ZIP</text>
  </g>
  <g class="tool">
    <rect x="205" y="300" width="125" height="56" rx="8"/>
    <text class="th" x="267" y="318">Cost estimator</text>
    <text class="ts" x="267" y="336">Price ranges</text>
  </g>
  <g class="tool">
    <rect x="350" y="300" width="125" height="56" rx="8"/>
    <text class="th" x="412" y="318">Booking</text>
    <text class="ts" x="412" y="336">Holds a slot</text>
  </g>
  <g class="tool">
    <rect x="495" y="300" width="125" height="56" rx="8"/>
    <text class="th" x="557" y="318">Reminders</text>
    <text class="ts" x="557" y="336">Timed texts</text>
  </g>

  <!-- Tools to external sources -->
  <line class="arr" x1="122" y1="358" x2="122" y2="428" marker-end="url(#arrow)"/>
  <line class="arr" x1="267" y1="358" x2="267" y2="428" marker-end="url(#arrow)"/>
  <line class="arr" x1="412" y1="358" x2="412" y2="428" marker-end="url(#arrow)"/>

  <g class="ext">
    <rect x="60" y="430" width="125" height="56" rx="8"/>
    <text class="th" x="122" y="448">Clinic directory</text>
    <text class="ts" x="122" y="466">HRSA open data</text>
  </g>
  <g class="ext">
    <rect x="205" y="430" width="125" height="56" rx="8"/>
    <text class="th" x="267" y="448">Price data</text>
    <text class="ts" x="267" y="466">Fee schedules</text>
  </g>
  <g class="ext">
    <rect x="350" y="430" width="125" height="56" rx="8"/>
    <text class="th" x="412" y="448">Clinics</text>
    <text class="ts" x="412" y="466">Call or calendar</text>
  </g>

  <!-- Legend -->
  <g class="core"><rect x="60" y="508" width="12" height="12" rx="2"/></g>
  <text class="ts label" x="80" y="514">Core service</text>
  <g class="tool"><rect x="180" y="508" width="12" height="12" rx="2"/></g>
  <text class="ts label" x="200" y="514">Agent tools</text>
  <g class="ext"><rect x="296" y="508" width="12" height="12" rx="2"/></g>
  <text class="ts label" x="316" y="514">External</text>
</svg>
