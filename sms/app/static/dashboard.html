<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareLine – Health worker dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --mute:#6b7383; --line:#e3e6ec;
          --em:#b42318; --hi:#c4570a; --med:#946200; --low:#3b6e3b; --brand:#1f5f8b; }
  * { box-sizing:border-box; } body { margin:0; font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--brand); color:#fff; }
  header h1 { font-size:17px; margin:0; } header .sp { flex:1 } header select { font:inherit; padding:4px 6px; border-radius:6px; border:0; }
  main { display:grid; grid-template-columns:360px 1fr; height:calc(100vh - 50px); }
  #list { overflow:auto; border-right:1px solid var(--line); background:var(--card); }
  .case { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .case:hover { background:#f1f4f8 } .case.sel { background:#e6eef6 }
  .case .top { display:flex; gap:8px; align-items:center; font-weight:600; }
  .case .msg { color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .pill { font-size:11px; font-weight:700; text-transform:uppercase; padding:2px 7px; border-radius:99px; color:#fff; }
  .emergency{background:var(--em)} .high{background:var(--hi)} .medium{background:var(--med)} .low{background:var(--low)}
  .closed { opacity:.55 } .booked{background:#1f5f8b} .cat { font-weight:500; color:var(--mute); font-size:13px; }
  #detail { display:flex; flex-direction:column; min-width:0; }
  #head { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  #head .sum { color:var(--mute); margin-top:4px; } #head button { float:right; }
  /* The thread is drawn like a phone's Messages app: the patient's texts on the left in gray,
     everything sent from the clinic number on the right in SMS green. */
  #thread { flex:1; overflow:auto; padding:12px max(20px, calc((100% - 720px) / 2)) 16px; display:flex; flex-direction:column; background:#fff; }
  .stamp { text-align:center; font-size:11px; color:#8e8e93; margin:4px 0 6px; line-height:1.35; } .stamp b { font-weight:600; }
  .b { max-width:72%; padding:7px 13px; border-radius:18px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:16px; line-height:21px;
       letter-spacing:-0.1px; margin-top:2px; position:relative; }
  .b.first { margin-top:10px; }
  .b.in { align-self:flex-start; background:#e9e9eb; color:#000; }
  .b.out { align-self:flex-end; background:#34c759; color:#fff; }
  .b.last::before, .b.last::after { content:""; position:absolute; bottom:0; height:18px; }
  .b.out.last::before { right:-7px; width:20px; background:#34c759; border-bottom-left-radius:16px 14px; }
  .b.out.last::after { right:-26px; width:26px; background:#fff; border-bottom-left-radius:10px; }
  .b.in.last::before { left:-7px; width:20px; background:#e9e9eb; border-bottom-right-radius:16px 14px; }
  .b.in.last::after { left:-26px; width:26px; background:#fff; border-bottom-right-radius:10px; }
  .cap { font-size:11px; color:#8e8e93; margin:3px 2px 0; } .cap.in { align-self:flex-start; } .cap.out { align-self:flex-end; }
  .cap .fail { color:var(--em); font-weight:600; }
  form { display:flex; gap:10px; align-items:flex-end; padding:10px max(20px, calc((100% - 720px) / 2)) 14px; background:#fff; }
  textarea { flex:1; font:inherit; font-size:16px; padding:8px 14px; border:1px solid #c8c8cc; border-radius:19px; resize:none; height:38px; outline:0; }
  form button { width:34px; height:34px; padding:0; border-radius:50%; background:#34c759; display:flex; align-items:center; justify-content:center; flex:none; }
  form button svg { width:16px; height:16px; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:0; background:var(--brand); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .empty { margin:auto; color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>CareLine</h1><span class="sp"></span>
  <select id="filter"><option value="open">Open</option><option value="">All</option><option value="closed">Closed</option></select>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Pick a case</div></div>
</main>
<script>
let selected = null, lastThread = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = t => new Date(t * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
const who = c => [c.first_name, c.last_name].filter(Boolean).join(" ") || c.patient_phone;
const label = m => ({patient:"Patient", chw:"Health worker, by text", dashboard:"Health worker, from dashboard", system:"Automatic reply"}[m.sender]);
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
function bubbles(thread) {
  if (!thread.length) return "";
  const d = new Date(thread[0].created_at * 1000), today = new Date().toDateString() === d.toDateString();
  let html = `<div class="stamp">Text Message · SMS<br><b>${today ? "Today" : d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"})}</b> ${clock(thread[0].created_at)}</div>`;
  thread.forEach((m, i) => {
    const side = m.sender === "patient" ? "in" : "out";
    const first = i === 0 || thread[i - 1].sender !== m.sender, last = i === thread.length - 1 || thread[i + 1].sender !== m.sender;
    html += `<div class="b ${side}${first ? " first" : ""}${last ? " last" : ""}">${esc(m.sender === "chw" ? m.body.replace(/^\s*#\d+\s*/, "") : m.body)}</div>`;
    if (m.channel === "failed") html += `<div class="cap ${side}"><span class="fail">Not sent</span></div>`;
    if (last) html += `<div class="cap ${side}">${label(m)} · ${clock(m.created_at)}</div>`;
  });
  return html;
}

async function loadList() {
  const r = await fetch("/api/cases" + ($("#filter").value ? "?status=" + $("#filter").value : ""));
  const cases = await r.json();
  $("#list").innerHTML = cases.map(c => `
    <div class="case ${c.id === selected ? "sel" : ""} ${c.status}" data-id="${c.id}">
      <div class="top">#${c.id} <span class="pill ${c.urgency}">${c.urgency}</span>
        <span class="cat">${esc(c.category.replace("_", " "))}</span>${c.booked ? ' <span class="pill booked">booked</span>' : ""}
        <span style="flex:1"></span><span class="cat">${esc(who(c))}</span></div>
      <div class="msg">${esc(c.last_patient_message)}</div>
    </div>`).join("") || '<div class="case"><div class="msg">No cases</div></div>';
  document.querySelectorAll(".case[data-id]").forEach(el => el.onclick = () => { selected = +el.dataset.id; lastThread = ""; loadList(); loadCase(); });
}

async function loadCase() {
  if (!selected) return;
  const r = await fetch("/api/cases/" + selected);
  if (!r.ok) return;
  const { case: c, messages, bookings, patient } = await r.json();
  const key = JSON.stringify([c.status, c.assigned_chw, messages.length, bookings.map(b => b.status)]);
  if (key === lastThread) return;
  lastThread = key;
  const thread = messages.filter(m => !(m.sender === "system" && m.to_phone !== c.patient_phone));
  $("#detail").innerHTML = `
    <div id="head">${c.status === "open" ? '<button class="ghost" id="close">Close case</button>' : ""}
      <b>#${c.id} · ${esc(patient && (patient.first_name || patient.last_name) ? [patient.first_name, patient.last_name].filter(Boolean).join(" ") : "Name not given")}</b>
      <span class="cat">${patient ? esc(patient.code) + " · " : "no account yet · "}${esc(c.patient_phone)}</span> <span class="pill ${c.urgency}">${c.urgency}</span>
      <span class="cat">${esc(c.category.replace("_", " "))} · ${c.status}${c.assigned_chw ? " · worker " + esc(c.assigned_chw) : " · unclaimed"}</span>
      <div class="sum">${esc(c.summary)}</div>
      <div class="sum">${c.town ? "Location: " + esc(c.town) + " " + esc(c.zip) : "Location: not given yet"}${c.income ? " · income: " + (c.income === "low" ? "low / Medicaid / uninsured" : "other insurance or can pay") : ""}</div>
      ${bookings.map(b => `<div class="sum"><b>${b.status === "booked" ? "Visit booked" : "Cancelled"}:</b> ${esc(b.clinic)}, ${esc(b.when)}</div>`).join("")}</div>
    <div id="thread">${bubbles(thread)}</div>
    ${c.status === "open" ? '<form id="f"><textarea id="t" placeholder="Text Message · SMS" aria-label="Text the patient"></textarea><button aria-label="Send"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5"/></svg></button></form>' : ""}`;
  $("#thread").scrollTop = 1e9;
  if ($("#f")) {
    $("#t").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#f").requestSubmit(); } };
    $("#f").onsubmit = async e => {
      e.preventDefault(); const body = $("#t").value.trim(); if (!body) return;
      await fetch(`/api/cases/${c.id}/reply`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({body})});
      lastThread = ""; loadCase(); loadList();
    };
  }
  if ($("#close")) $("#close").onclick = async () => { await fetch(`/api/cases/${c.id}/close`, {method:"POST"}); lastThread = ""; loadCase(); loadList(); };
}

$("#filter").onchange = loadList;
loadList(); setInterval(() => { loadList(); loadCase(); }, 2000);
</script>
</body>
</html>
